<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar Incidencias</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=1.18">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title"><i class="fas fa-tools"></i> Panel</h2>
    </div>
    <ul>
      <li><a href="../index.html"><i class="fas fa-home"></i> <span class="sidebar-link-text">Inicio</span></a></li>
      <li><a href="reportes.html" class="active"><i class="fas fa-search"></i> <span class="sidebar-link-text">Buscar Incidencias</span></a></li>
    </ul>
  </aside>

  <main id="mainContent">
    <section class="encabezado">
      <h2>Filtrar incidencias</h2>
      
      <div class="d-flex flex-wrap gap-2 mb-3">
        <button type="button" class="btn btn-outline-success btn-sm btn-filtro-rapido" data-filtro="Mr. Tienda/Mr. Chef">Mr. Tienda</button>
        <button type="button" class="btn btn-outline-info btn-sm btn-filtro-rapido" data-filtro="Distribuidora el Florido">El Florido</button>
        <button type="button" class="btn btn-outline-info btn-sm btn-filtro-rapido" data-filtro="Calimax">Calimax</button>
        <button type="button" class="btn btn-outline-warning btn-sm btn-filtro-rapido" data-filtro="programadas">
          <i class="bi bi-robot"></i> Solo Programadas
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm btn-filtro-rapido" data-filtro="todos">Mostrar Todos</button>
      </div>
      
      <form id="report-form">
        <details class="filtros-avanzados" open>
          <summary>Filtros avanzados</summary>
          <div class="row mt-3">
            <div class="col-md-6">
              <label>Cliente:</label>
              <select id="cliente" name="cliente" class="form-select">
                <option value="">Seleccionar Cliente</option>
                <option value="todos">Todos los clientes</option>
              </select>
            </div>
            <div class="col-md-6">
              <label>Categoría:</label>
              <select id="tipo-equipo" name="tipo_equipo" class="form-select">
                <option value="">Seleccionar categoría</option>
                <option value="Mr. Tienda/Mr. Chef">Mr. Tienda/Mr. Chef</option>
                <option value="Distribuidora el Florido">Distribuidora el Florido</option>
                <option value="Calimax">Calimax</option>
                <option value="Recolección">Recolección</option>
                <option value="Otros">Otros</option>
              </select>
            </div>
          </div>

          <div class="row mt-3">
            <div class="col-md-4">
              <label>Fecha Inicio:</label>
              <input type="date" id="fecha-inicio" class="form-control">
            </div>
            <div class="col-md-4">
              <label>Fecha Fin:</label>
              <input type="date" id="fecha-fin" class="form-control">
            </div>
            <div class="col-md-4">
              <label>Estatus:</label>
              <select id="estatus" class="form-select">
                <option value="">Seleccionar Estatus</option>
                <option value="Abierto">Abierto</option>
                <option value="Asignado">Asignado</option>
                <option value="Pendiente">Pendiente</option>
                <option value="Completado">Completado</option>
                <option value="Cerrado sin factura">Cerrado sin factura</option>
                <option value="Cerrado con factura">Cerrado con factura</option>
              </select>
            </div>
          </div>
        
          <div class="row mt-3">
            <div class="col-md-6">
              <label>Sucursal:</label>
              <input type="text" id="sucursal" class="form-control" placeholder="Nombre sucursal">
            </div>
            <div class="col-md-6">
              <label>Técnico:</label>
              <select id="tecnico" class="form-select">
                <option value="">Seleccione un técnico</option>
                <option value="Luis Limón">Luis Limón</option>
                <option value="Jacob Ventura">Jacob Ventura</option>
                </select>
            </div>
          </div>
          
          <div class="row mt-3">
            <div class="col-md-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="solo-activas">
                <label class="form-check-label" for="solo-activas">Solo incidencias activas</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="solo-programadas">
                <label class="form-check-label" for="solo-programadas"><strong>Solo incidencias automáticas (Programadas)</strong></label>
              </div>
            </div>
          </div>
        
          <div class="mt-3">
            <button type="submit" class="btn btn-primary me-2"><i class="bi bi-search"></i> Buscar</button>
            <button type="button" class="btn btn-outline-secondary" onclick="limpiarFiltros()">Limpiar</button>
          </div>
        </details>
      </form>
    </section>

    <section class="lista-incidencias">
      <div id="report-data" style="overflow-x: auto;">
        <table class="table table-striped table-hover">
          <thead class="table-light">
            <tr>
              <th># Reporte Interno</th>
              <th># Incidencia Cliente</th>
              <th>Cliente</th>
              <th>Sucursal</th>
              <th>Falla</th>
              <th>Fecha</th>
              <th>Estatus</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tabla-body"></tbody>
        </table>
        
        <div class="d-flex justify-content-between align-items-center mt-3">
          <select class="form-select form-select-sm" id="select-registros" style="width: auto;">
            <option value="10">10 por página</option>
            <option value="25">25 por página</option>
          </select>
          <nav>
            <ul class="pagination pagination-sm mb-0">
              <li class="page-item" id="btn-prev"><a class="page-link" href="#">Anterior</a></li>
              <li class="page-item" id="btn-next"><a class="page-link" href="#">Siguiente</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/script-busquedas.js?v=3" defer></script>
</body>
</html>
