<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SIPCONS - Registro de Ventas</title>
  <link rel="stylesheet" href="../css/styles.css?v=4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="../scripts/ventas.js?v=8" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header"> <h2 class="sidebar-title">Panel</h2> </div>
    <ul>
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="ventas.html" class="active">Registro Ventas</a></li>
    </ul>
  </aside>
  
  <main id="mainContent">
    <section class="encabezado">
      <h2><i class="fas fa-cash-register"></i> Registro de Ventas</h2>
      <form id="form-venta">
        <div class="form-row">
          <div>
            <label for="fecha_venta"><i class="fas fa-calendar-alt"></i> Fecha de Venta:</label>
            <input type="date" id="fecha_venta" name="fecha_venta" required>
          </div>
          <div>
            <label for="cliente">Cliente:</label>
            <select id="cliente" name="cliente" required></select>
          </div>
          <div>
            <label for="sucursal">Sucursal:</label>
            <input type="text" id="sucursal" name="sucursal">
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="equipo">Equipo:</label>
            <input type="text" id="equipo" name="equipo" required>
          </div>
          <div>
            <label for="marca">Marca:</label>
            <input type="text" id="marca" name="marca" required>
          </div>
        </div>

        <div class="form-row">
          <div class="full-width">
            <label for="modelo">Modelo:</label>
            <input type="text" id="modelo" name="modelo" required>
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="qty">Cantidad:</label>
            <input type="number" id="qty" name="qty" min="1" value="1" required>
          </div>
          <div>
            <label for="garantia">Garantía (meses):</label>
            <input type="number" id="garantia" name="garantia" value="0">
          </div>
          <div>
            <label for="calibracion">Calibración (meses):</label>
            <input type="number" id="calibracion" name="calibracion" value="0">
          </div>
          <div class="checkbox-container">
            <label for="servicio">
              <input type="checkbox" id="servicio" name="servicio"> Cláusula servicio
            </label>
            <div id="contenedor-frecuencia" style="display:none;">
              <input type="number" id="frecuencia_servicio" name="frecuencia_servicio" placeholder="Meses">
            </div>
          </div>
        </div>

        <div id="series-container"></div>

        <div class="form-row">
          <textarea id="notas" name="notas" placeholder="Notas..."></textarea>
        </div>

        <div class="filtro-item">
          <label>Facturas:</label>
          <input type="file" id="facturas" name="facturas[]" multiple>
        </div>
        
        <button type="button" id="btn-registrar-venta" class="btn-primary" style="width:100%;">Registrar Venta</button>
      </form>
    </section>
  </main>

  <script>
    async function cargarClientesEnSelect() {
        const response = await fetch(`../backend/obtener-clientes.php?t=${Date.now()}`);
        const clientes = await response.json();
        const select = document.getElementById('cliente');
        select.innerHTML = '<option value="" selected disabled>Seleccione un cliente</option>'; 
        clientes.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.nombre; opt.textContent = c.nombre;
            select.appendChild(opt);
        });
    }
    document.addEventListener('DOMContentLoaded', cargarClientesEnSelect);
  </script>
</body>
</html>
